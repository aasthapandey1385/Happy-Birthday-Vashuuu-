<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Vashu!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #ff6b81;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #b2bec3;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .photo-card {
            background: #1e1e1e;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .photo-card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            object-fit: cover;
        }
        .caption {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #dfe6e9;
            font-weight: 500;
        }
        audio {
            width: 100%;
            margin-top: 20px;
            border-radius: 30px;
        }
        .footer {
            margin-top: 40px;
            color: #636e72;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy 22nd Birthday, Vashu! 🎂✨</h1>
        <p class="subtitle">A little gallery of our favorite moments 💗🧿</p>

        <!-- Background Music -->
        <audio controls autoplay loop>
            <source src="song.mp3" type="audio/mp3">
            Your browser does not support the audio element.
        </audio>

        <!-- Photo 1: Childhood -->
        <div class="photo-card">
            <img src="childhood.jpg" alt="Childhood AI Photo">
            <div class="caption">Bachpan se hi fixed tha ki dono ek dusre ke hai 😂💗</div>
        </div>

        <!-- Photo 2: Favorite Photo -->
        <div class="photo-card">
            <img src="photo1.jpg" alt="Favorite Photo">
            <div class="caption">Isse zyaada cute photo ho hi nhi sakta ✨</div>
        </div>

        <!-- Photo 3: Black & White -->
        <div class="photo-card">
            <img src="photo2.jpg" alt="B&W Photo">
            <div class="caption">Puraani movies ka superhit hero 🎬</div>
        </div>

        <!-- Photo 4: Tracksuit -->
        <div class="photo-card">
            <img src="photo3.jpg" alt="Tracksuit Couple">
            <div class="caption">The COOLEST Tracksuit Couple ever! 😂💙</div>
        </div>

        <div class="footer">
            Made with lots of love and patience! 💗🧿
        </div>
    </div>

</body>
</html>
